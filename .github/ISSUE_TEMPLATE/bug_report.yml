name: Bug report
description: Report a reproducible problem in CollabSpace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Check existing issues first. Remove passwords, tokens, personal data, and other secrets from all examples and logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and where you saw it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable set of steps.
      placeholder: |
        1. Sign in
        2. Open a workspace
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and relevant Node.js version.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before posting.
    validations:
      required: false

