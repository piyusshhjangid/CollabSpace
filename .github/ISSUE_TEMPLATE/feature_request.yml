name: Feature request
description: Propose a user-focused improvement or new capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the outcome a user should see. Avoid prescribing implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: handbook
    attributes:
      label: Handbook or roadmap reference
      description: Optional section or related issue.
    validations:
      required: false

