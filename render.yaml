services:
  - type: web
    name: collabspace-app
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: collabspace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabspace-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: collabspace-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_SERVER_URL
        fromService:
          type: web
          name: collabspace-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          type: web
          name: collabspace-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false
      - key: LINEAR_CLIENT_ID
        sync: false
      - key: LINEAR_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: GITLAB_BASE_URL
        value: https://gitlab.com
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: GEMINI_EMBEDDING_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

  - type: keyvalue
    name: collabspace-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

databases:
  - name: collabspace-db
    databaseName: collabspace
    user: collabspace
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
