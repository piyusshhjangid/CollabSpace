services:
  - type: web
    name: collabspace-app
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: collabspace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabspace-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: collabspace-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          type: web
          name: collabspace-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true

  - type: worker
    name: collabspace-github-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: npm run worker:github
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collabspace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabspace-redis
          property: connectionString

  - type: keyvalue
    name: collabspace-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: collabspace-db
    databaseName: collabspace
    user: collabspace
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []

